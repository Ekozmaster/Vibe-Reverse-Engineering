; remix-comp-proxy configuration (d3d9.dll proxy) — F.E.A.R. Ultimate Shooter Edition
; Adapted from xoxor4d/remix-comp-base by kim2091 for Vibe Reverse Engineering
;
; FEAR runtime context:
;   - LithTech Jupiter EX engine, MSVC 7.1, ImageBase 0x00400000
;   - Hybrid FFP + shader rendering: 52 SetTransform, 24 SetVertexShaderConstantF
;   - No FFP skinning detected (D3DRS_VERTEXBLEND/INDEXEDVERTEXBLENDENABLE both DISABLED)
;   - User has RTX Remix bridge installed in <game>/.trex/

[Remix]
; FFP path (SetTransform matrix capture + fog-disable + SELECTARG1) renders the
; world correctly under [Remix]=0 system-d3d9 fallback (verified 2026-05-06).
; Re-engaging the bridge: launches must go through scripts/spawn_gate_bridge.py
; (Frida-instrumented child-gated spawn) — vanilla launches handshake but FEAR
; then hangs before CreateDevice on a post-handshake bridge IPC call.
Enabled=1
DLLName=d3d9_remix.dll
; The bridge .trex/d3d9.dll is copied to <game>/d3d9_remix.dll by deploy.ps1.

; ============================================================
; DLL/ASI Chain Loading
;
; PreLoad:  Loaded during DllMain, before the d3d9 chain.
; PostLoad: Loaded after the game window is found.
;
; Semicolon-separated. Paths relative to the game directory.
; Supports .dll and .asi files.
;
; Example: PreLoad=patch.dll;fix.asi
; ============================================================
[Chain]
PreLoad=
PostLoad=

; ============================================================
; FFP Conversion Settings
;
; Set Enabled=0 to disable FFP conversion entirely (passthrough mode).
; Useful for tracing or non-FFP mods.
; ============================================================
[FFP]
; SetTransform-based matrix capture is wired (proxy intercepts FEAR's per-draw
; W/V/P SetTransform calls into the ffp_state seam). FFP path now disables fog
; per-draw and uses SELECTARG1 stage 0 to avoid white-wash and black-modulation
; artifacts. AlbedoStage=0 is the LithTech default; bump if specific surfaces
; render with the wrong texture.
Enabled=1
AlbedoStage=0

; ============================================================
; Skinning (OFF by default)
;
; Only enable after rigid FFP geometry works correctly.
; See documentation for skinning setup workflow.
; ============================================================
[Skinning]
Enabled=0

; ============================================================
; Diagnostic Logging
;
; AutoCapture: Writes rtx_comp\diagnostics.log after DelayMs milliseconds.
; Logs LogFrames frames of draw call data for debugging.
; The delay ensures the game is in-game with real geometry.
;
; On-demand capture is always available from the ImGui overlay
; (F4 -> Diagnostics tab) regardless of AutoCapture setting.
;
; Log categories control what data is captured.
; All categories default to ON. Disable to reduce log noise.
; ============================================================
[Diagnostics]
Enabled=1
AutoCapture=1
; Delay reduced from 180000 to 60000 so capture fires while in-level and before
; any d3d9_remix.dll+0xf0cc focus-toggle crash. Restore to 180000 once stable.
DelayMs=60000
LogFrames=3
LogDrawCalls=1
LogVSConstants=1
LogVertexData=1
LogDeclarations=1
LogTextures=1
LogPresentInfo=1

; ============================================================
; Frame Tracer
;
; Integrated D3D9 call tracer. Captures all API calls to JSONL
; for offline analysis with:
;   python -m graphics.directx.dx9.tracer analyze <file.jsonl> --summary
;
; FFP is automatically disabled during capture to record
; the game's unmodified calls.
; ============================================================
[Tracer]
BacktraceDepth=8
OutputDir=captures
