; remix-comp-proxy configuration (d3d9.dll proxy)
; Adapted from xoxor4d/remix-comp-base by kim2091 for Vibe Reverse Engineering
;
; Numbers are decimal: write ViewStart=8, not c8 or 0x8. A ";" comment may
; follow a number on its line. A value that is not a number is reported in
; rtx_comp\console.log and the setting keeps its default. Switches are 1 or 0.

[Remix]
Enabled=1
DLLName=d3d9_remix.dll

; ============================================================
; DLL/ASI Chain Loading
;
; PreLoad:  Loaded during DllMain, before the d3d9 chain.
; PostLoad: Loaded after the game window is found.
;
; Semicolon-separated. Paths relative to the game directory.
; Supports .dll and .asi files.
;
; Example: PreLoad=patch.dll;fix.asi
; ============================================================
[Chain]
PreLoad=
PostLoad=

; ============================================================
; FFP Conversion Settings
;
; Set Enabled=0 to disable FFP conversion entirely (passthrough mode).
; Useful for tracing or non-FFP mods.
; ============================================================
[FFP]
Enabled=1
AlbedoStage=0

; ============================================================
; Vertex Shader Constant Registers
;
; Where the game uploads its View, Projection and World matrices
; with SetVertexShaderConstantF. Start is the first register of a
; matrix and End is one past its last, always Start + 4: a 4x4
; matrix in c8-c11 is Start=8, End=12. With skinning enabled, every
; matrix has to lie below BoneThreshold.
;
; find_matrix_registers.py suggests a layout. Confirm it with a
; live trace or a frame capture before relying on it.
; ============================================================
[FFP.Registers]
ViewStart=0
ViewEnd=4
ProjStart=4
ProjEnd=8
WorldStart=16
WorldEnd=20

; ============================================================
; Skinning (OFF by default)
;
; Only enable after rigid FFP geometry works correctly.
; See documentation for skinning setup workflow.
;
; A SetVertexShaderConstantF upload is taken as the bone palette
; when it starts at register BoneThreshold or above, covers at
; least BoneMinRegs registers and holds a whole number of bones.
; RegsPerBone is 3 for packed 4x3 bone matrices and 4 for 4x4.
; find_skinning.py suggests BoneThreshold and RegsPerBone.
; ============================================================
[Skinning]
Enabled=0
BoneThreshold=20
RegsPerBone=3
BoneMinRegs=3

; ============================================================
; Diagnostic Logging
;
; AutoCapture: Writes rtx_comp\diagnostics.log after DelayMs milliseconds.
; Logs LogFrames frames of draw call data for debugging.
; The delay ensures the game is in-game with real geometry.
;
; On-demand capture is always available from the ImGui overlay
; (F4 -> Diagnostics tab) regardless of AutoCapture setting.
;
; Log categories control what data is captured.
; All categories default to ON. Disable to reduce log noise.
; ============================================================
[Diagnostics]
Enabled=1
AutoCapture=1
DelayMs=50000
LogFrames=3
LogDrawCalls=1
LogVSConstants=1
LogVertexData=1
LogDeclarations=1
LogTextures=1
LogPresentInfo=1

; ============================================================
; Frame Tracer
;
; Integrated D3D9 call tracer. Captures all API calls to JSONL
; for offline analysis with:
;   python -m graphics.directx.dx9.tracer analyze <file.jsonl> --summary
;
; FFP is automatically disabled during capture to record
; the game's unmodified calls.
; ============================================================
[Tracer]
BacktraceDepth=8
OutputDir=captures
