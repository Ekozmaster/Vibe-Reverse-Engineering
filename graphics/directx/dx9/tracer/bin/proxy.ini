[Trace]
; Frames to capture for a trigger file that names no count (default 2);
; "trigger --frames N" writes frames=N into the file, which wins
CaptureFrames=2
; Log Create* calls at boot for shader bytecodes (1=on, 0=off)
CaptureInit=1

[Chain]
; Optional DLL to chain-load (e.g. another d3d9 wrapper)
; Leave empty to load system d3d9.dll directly.
DLL=
